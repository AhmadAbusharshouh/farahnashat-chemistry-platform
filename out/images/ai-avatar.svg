<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#025e43"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="darkVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle/Hex Badge -->
  <rect width="200" height="200" rx="40" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="4"/>

  <!-- Atomic Orbit Rings behind head -->
  <ellipse cx="100" cy="100" rx="75" ry="28" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" transform="rotate(-25 100 100)" opacity="0.6"/>
  <circle cx="165" cy="70" r="4" fill="#047857"/>
  <circle cx="35" cy="130" r="3.5" fill="#059669"/>

  <!-- Robot Antenna / Chemical Flask Stem Top -->
  <path d="M100 48 L100 28" stroke="#047857" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="100" cy="24" r="7" fill="url(#accentGrad)" stroke="#047857" stroke-width="3"/>
  <circle cx="100" cy="24" r="2.5" fill="#ffffff"/>

  <!-- Cute Robot Head Outer Shield (Hexagonal Curvature) -->
  <path d="M60 52 L140 52 C158 52 168 64 168 82 L168 128 C168 146 156 158 138 158 L62 158 C44 158 32 146 32 128 L32 82 C32 64 42 52 60 52 Z" 
        fill="url(#emeraldGrad)" 
        stroke="#022c22" 
        stroke-width="3.5"/>

  <!-- Ear / Node Bolts -->
  <rect x="22" y="88" width="10" height="24" rx="4" fill="#022c22"/>
  <rect x="24" y="92" width="6" height="16" rx="2" fill="#34d399"/>
  <rect x="168" y="88" width="10" height="24" rx="4" fill="#022c22"/>
  <rect x="170" y="92" width="6" height="16" rx="2" fill="#34d399"/>

  <!-- Dark Visor Screen -->
  <rect x="46" y="66" width="108" height="62" rx="14" fill="url(#darkVisor)" stroke="#047857" stroke-width="2"/>

  <!-- Glowing Digital Eyes (Friendly curved pills) -->
  <rect x="62" y="82" width="24" height="20" rx="8" fill="#34d399" filter="url(#glow)"/>
  <circle cx="72" cy="90" r="3" fill="#ffffff"/>
  <rect x="114" y="82" width="24" height="20" rx="8" fill="#34d399" filter="url(#glow)"/>
  <circle cx="124" cy="90" r="3" fill="#ffffff"/>

  <!-- Cute Digital Smile / Audio Wave -->
  <path d="M88 114 Q100 122 112 114" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Chemistry Emblem on Chin / Badge -->
  <path d="M93 140 L107 140 L112 148 L107 154 L93 154 L88 148 Z" fill="#34d399" opacity="0.9"/>
  <circle cx="100" cy="147" r="2" fill="#022c22"/>
</svg>
